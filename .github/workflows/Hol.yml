name: Compila la mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Estrai lo ZIP (solo se hai caricato lo ZIP invece dei file)
        shell: bash
        run: |
          if [ ! -f build.gradle ] && ls ./*.zip >/dev/null 2>&1; then unzip -o -q ./*.zip; fi
          ls

      - name: Installa Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Installa Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Trova l'ultima versione di NeoForge per Minecraft 26.3
        id: neo
        shell: bash
        run: |
          V=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -o '<version>26\.3\.[^<]*' | sed 's/<version>//' | sort -V | tail -1 || true)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "NeoForge: $V"

      - name: Compila
        id: build
        continue-on-error: true
        shell: bash
        run: |
          ARGS=""
          if [ -n "${{ steps.neo.outputs.version }}" ]; then ARGS="-Pneo_version=${{ steps.neo.outputs.version }}"; fi
          gradle build --no-daemon --console=plain $ARGS 2>&1 | tee build.log

      - name: Riassunto (errori già pronti da copiare)
        if: always()
        shell: bash
        run: |
          {
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "## ✅ Compilazione riuscita"
              echo "Il file .jar è nella sezione **Releases** del repository (scarichi direttamente il .jar) e negli Artifacts di questa esecuzione."
            else
              echo "## ❌ Compilazione fallita"
              echo "Tocca l'icona copia sul blocco qui sotto e incollalo a Claude:"
              echo '```'
              grep -E "error:|symbol:|location:" -A2 build.log | head -150 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Interrompi se la compilazione è fallita
        if: steps.build.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Salva il jar (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: horrorverse-jar
          path: build/libs/*.jar

      - name: Pubblica il jar nelle Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Horror Universe - build ${{ github.run_number }}
          files: build/libs/*.jar
